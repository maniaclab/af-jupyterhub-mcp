apiVersion: v1
kind: Pod
metadata:
  name: {{ include "af-jupyterhub-mcp.fullname" . }}-test-healthz
  labels:
    {{- include "af-jupyterhub-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: healthz
      image: curlimages/curl:8.11.1
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - http://{{ include "af-jupyterhub-mcp.fullname" . }}:{{ .Values.service.port }}/healthz
  restartPolicy: Never
