# Default values for af-jupyterhub-mcp.
#
# -- Container image. There is no published af-jupyterhub-mcp image; the
# chart runs the prefix-dev pixi image and installs af-jupyterhub-mcp at pod
# startup (see initContainer), same as af-jupyterlab-mcp/ami-mcp.
image:
  repository: ghcr.io/prefix-dev/pixi
  tag: "0.69.0-jammy"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- af-jupyterhub-mcp release pinned into the rendered pixi.toml at /workspace.
jupyterhubMcp:
  # Conda-forge version of af-jupyterhub-mcp to install (==<version>).
  version: "0.1.1"
  # Extra conda-forge dependencies merged into the rendered pixi.toml, as a
  # name -> version-spec map.
  extraPixiDependencies: {}
  # Frozen pixi.lock content for reproducible installs. Empty by default (a
  # release must exist before it can be locked). Supply with, e.g.:
  #   helm install ... --set-file jupyterhubMcp.pixiLockContent=pixi.lock
  # When set, the lock is mounted alongside pixi.toml and pixi installs from it.
  pixiLockContent: ""

replicaCount: 1

# -- af-jupyterhub-mcp / uvicorn log level: debug | info | warning | error.
logLevel: info

# -- IPs trusted for X-Forwarded-* headers. "*" trusts the in-cluster ingress/aggregator.
forwardedAllowIps: "*"

server:
  # Bind address inside the pod.
  host: "0.0.0.0"
  # Container port for the MCP HTTP endpoint (also serves /healthz).
  port: 8000
  # Public URL clients reach the server at (--resource-url). Empty = the
  # server falls back to http://<host>:<port> (fine behind the aggregator,
  # which is the only expected caller -- see ingress.enabled below).
  resourceUrl: ""

# -- The JupyterHub this backend drives, with the caller's own hub token.
hub:
  # Base URL for every hub API call and the /user/<name>/<server>/mcp
  # notebook proxy (env JUPYTERHUB_MCP_HUB_URL). In-cluster, point it at the
  # hub's proxy Service, e.g. http://proxy-public.binderhub.svc.cluster.local.
  url: "https://jupyterhub.af.uchicago.edu"
  # Base URL for links shown to users, such as a server's JupyterLab URL
  # (env JUPYTERHUB_MCP_PUBLIC_HUB_URL). Empty = use hub.url. Set it to the
  # public hub whenever hub.url is an in-cluster address.
  publicUrl: ""

# -- What create_jupyter_server may launch, and how the nb_* tools treat
# each image.
notebook:
  images:
    # Image allowlists, split by workload shape. create_jupyter_server
    # requires a cpu image for gpus=0 and a gpu image for gpus>0. Every image
    # must include jupyterhub-singleuser (ml_platform has since #21) and
    # jupyter-mcp-server for the nb_* tools. Bumping an image is a values
    # change, not an af-jupyterhub-mcp release.
    cpu:
      - hub.opensciencegrid.org/usatlas/ml-platform-cpu:latest
    gpu:
      - hub.opensciencegrid.org/usatlas/ml-platform-gpu:latest
    # Per-image tool support for the nb_*/nb_ui_* proxy tools, keyed by the
    # exact image string a server's user_options.image carries (for servers
    # launched from the BinderHub UI that is the BinderHub-built image).
    # Images without an entry are assumed to support every tool (i.e. to
    # match the latest ml-platform image); an entry lists the upstream
    # jupyter-mcp-server tool ids that image's notebook server offers (an
    # empty list means none -- calls get a clear "not supported by image"
    # error instead of a transport failure). Example for the 2026.8.17
    # images (jupyter-mcp-server 1.0.2 with the default jupyter-mcp-tools
    # allowlist: no clear_cell_output, only two JupyterLab UI commands):
    #   hub.opensciencegrid.org/usatlas/ml-platform-cpu:2026.8.17: &mcp-1x
    #     - list_files
    #     - list_kernels
    #     - list_notebooks
    #     - use_notebook
    #     - unuse_notebook
    #     - restart_notebook
    #     - read_notebook
    #     - read_cell
    #     - insert_cell
    #     - overwrite_cell_source
    #     - edit_cell_source
    #     - delete_cell
    #     - move_cell
    #     - execute_cell
    #     - insert_execute_code_cell
    #     - execute_code
    #     - notebook_run-all-cells
    #     - notebook_get-selected-cell
    #   hub.opensciencegrid.org/usatlas/ml-platform-gpu:2026.8.17: *mcp-1x
    toolOverrides: {}

  # Site names create_jupyter_server accepts (list_sites shows them). The
  # hub spawner falls back to its local site for any name it does not
  # recognise, so "local" always works.
  sites:
    - local

  # How long create_jupyter_server follows the hub's spawn progress before
  # giving up (the server is left pending, not deleted).
  launchTimeoutSeconds: 900

# NOTE: the CPU/memory RANGE guardrails (1-16 cores, 1-256 GB) are NOT chart
# values -- they are always-enforced validation in the server itself. The
# per-user named-server limit (10) is the hub's own setting.

auth:
  # How long a verified hub token's identity is cached (keyed by the token's
  # SHA-256) before /hub/api/user is asked again.
  cacheTtlSeconds: 60

# -- Extra environment variables for the main container (free-form list of
# corev1.EnvVar). Use for settings the chart does not template.
extraEnv: []

# -- Disabled by default: the expected caller is the af-mcp-platform
# aggregator, in-cluster, via the Service below -- not a public ingress.
# Enable only if you need to reach this backend directly.
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The server only talks to JupyterHub over HTTP, never to the Kubernetes
  # API, so the pod gets no ServiceAccount token. There is no RBAC.
  automountServiceAccountToken: false

# NOTE: no ServiceMonitor/Grafana dashboard -- af-jupyterhub-mcp exposes no
# /metrics endpoint yet.

# Resources for the pixi-install init container (install is the heavy step).
initResources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod-level securityContext (rendered as-is via toYaml).
podSecurityContext: {}

# -- Container-level securityContext (rendered as-is via toYaml), applied to
# both the pixi-install init container and the main container. Defaults are
# safe no-ops for this workload: the init container runs `pixi install` and
# the main container runs `pixi shell-hook` against /workspace (an emptyDir),
# both of which currently expect to run as the image's default user (root)
# and may write outside /workspace (e.g. pixi/conda caches under $HOME). Do
# NOT default `runAsNonRoot: true` or `readOnlyRootFilesystem: true` without
# first verifying the pixi image + install flow tolerates them (ami-mcp's
# chart carries the identical note).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
